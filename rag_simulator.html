<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Simulator</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

.container{
width:1100px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:20px;
margin-bottom:20px;
border-radius:10px;
}

textarea,input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:none;
}

button{
margin-top:10px;
padding:10px 15px;
background:#3b82f6;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.step{
background:#111827;
padding:15px;
border-radius:8px;
margin-top:10px;
}

.highlight{
color:#60a5fa;
font-weight:bold;
}

.output{
background:black;
padding:10px;
border-radius:5px;
margin-top:10px;
white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<h1>RAG Simulator (Learning Tool)</h1>

<div class="grid">

<div class="card">

<h2>Step 1: Add Knowledge Base</h2>

<textarea id="documents" rows="6" placeholder="Paste documents here..."></textarea>

<button onclick="createChunks()">Create Chunks</button>

<div class="step">
<div class="highlight">Chunks</div>
<div id="chunks" class="output"></div>
</div>

<button onclick="createEmbeddings()">Generate Embeddings</button>

<div class="step">
<div class="highlight">Vector DB</div>
<div id="vectors" class="output"></div>
</div>

</div>

<div class="card">

<h2>Step 2: Ask a Question</h2>

<input id="query" placeholder="Ask a question"/>

<button onclick="embedQuery()">Embed Query</button>

<div class="step">
<div class="highlight">Query Embedding</div>
<div id="queryEmbedding" class="output"></div>
</div>

<button onclick="retrieve()">Retrieve Relevant Chunks</button>

<div class="step">
<div class="highlight">Retrieved Context</div>
<div id="retrieved" class="output"></div>
</div>

<button onclick="generate()">Generate Answer</button>

<div class="step">
<div class="highlight">LLM Answer</div>
<div id="answer" class="output"></div>
</div>

</div>

</div>

</div>

<script>

let chunks=[]
let vectors=[]
let retrievedChunks=[]
let queryVector=[]

function tokenize(text){
return text.toLowerCase().split(/\W+/)
}

function vectorize(text){
let words=tokenize(text)
let map={}
words.forEach(w=>{
map[w]=(map[w]||0)+1
})
return map
}

function cosine(v1,v2){

let dot=0
let norm1=0
let norm2=0

for(let key in v1){
norm1+=v1[key]*v1[key]
if(v2[key]) dot+=v1[key]*v2[key]
}

for(let key in v2){
norm2+=v2[key]*v2[key]
}

return dot/(Math.sqrt(norm1)*Math.sqrt(norm2)+0.0001)

}

function createChunks(){

let text=document.getElementById("documents").value

chunks=text.split(".").map(c=>c.trim()).filter(c=>c)

document.getElementById("chunks").innerText=
chunks.map((c,i)=>"Chunk "+(i+1)+": "+c).join("\n")

}

function createEmbeddings(){

vectors=chunks.map(c=>({
text:c,
vector:vectorize(c)
}))

document.getElementById("vectors").innerText=
JSON.stringify(vectors.map(v=>v.vector),null,2)

}

function embedQuery(){

let query=document.getElementById("query").value

queryVector=vectorize(query)

document.getElementById("queryEmbedding").innerText=
JSON.stringify(queryVector,null,2)

}

function retrieve(){

let scored=vectors.map(v=>{

return{
text:v.text,
score:cosine(queryVector,v.vector)
}

})

scored.sort((a,b)=>b.score-a.score)

retrievedChunks=scored.slice(0,3)

document.getElementById("retrieved").innerText=
retrievedChunks.map(c=>"Score: "+c.score.toFixed(2)+"\n"+c.text).join("\n\n")

}

function generate(){

let query=document.getElementById("query").value

let context=retrievedChunks.map(c=>c.text).join(". ")

let answer=
"Using retrieved knowledge:\n\n"+
context+
"\n\nAnswer:\n"+
"Based on the knowledge base, the answer to '"+query+"' is related to the information above."

document.getElementById("answer").innerText=answer

}

</script>

</body>
</html>
